<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan & Update Asset - Inventory</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f2740;
      color: #fff;
      margin: 0;
      padding: 18px 14px 28px;
      text-align: center;
      min-height: 100vh;
    }
    h3 { margin: 4px 0 14px; font-size: 17px; }
    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #1d4ed8;
    }
    #result {
      margin: 16px auto 0;
      max-width: 420px;
      padding: 14px;
      border-radius: 10px;
      background: #16324f;
      min-height: 40px;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
    }
    .ok { color: #4ade80; font-weight: 600; }
    .warn { color: #fbbf24; font-weight: 600; }
    .err { color: #f87171; font-weight: 600; }

    /* ---- Form edit field asset ---- */
    #editForm {
      display: none;
      max-width: 420px;
      margin: 14px auto 0;
      background: #16324f;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
    }
    #editForm label {
      display: block;
      font-size: 12.5px;
      color: #93a5bb;
      margin: 10px 0 4px;
    }
    #editForm input, #editForm select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #2a4a6b;
      background: #0f2740;
      color: #fff;
      font-size: 14px;
    }
    #photoBox { margin-top: 4px; }
    #fPhotoPreview { display: none; width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; border: 1px solid #2a4a6b; }
    #fPhotoEmpty { font-size: 12.5px; color: #93a5bb; padding: 10px; border: 1px dashed #2a4a6b; border-radius: 10px; text-align: center; }
    .btnRow.photo { margin-top: 8px; }
    .btnRow.photo button { background: #2a4a6b; color: #fff; }
    .btnRow.photo #btnUploadPhoto { background: #0f766e; }
    .btnRow.photo button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btnRow { display: flex; gap: 8px; margin-top: 16px; }
    .btnRow button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #btnSave { background: #1d4ed8; color: #fff; }
    #btnSkip { background: #2a4a6b; color: #cbd5e1; }
    #btnSave:disabled { opacity: 0.5; cursor: not-allowed; }

    #history {
      max-width: 420px;
      margin: 18px auto 0;
      text-align: left;
      font-size: 12.5px;
      color: #cbd5e1;
    }
    #history div { padding: 6px 8px; border-bottom: 1px solid #1e3a5f; }
    .hint { color: #93a5bb; font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
  <h3>📥 Scan & Input/Update Asset</h3>
  <div id="reader"></div>
  <div id="result">Arahkan kamera ke barcode/QR kode asset...</div>

  <!-- Form ini HANYA muncul setelah scan berhasil & data asset ditemukan -->
  <div id="editForm">
    <div style="font-size:13px;color:#93a5bb;">
      Kode: <b id="fCode" style="color:#fff;"></b> — <span id="fItem"></span>
    </div>
    <label>Department / PIC</label>
    <input id="fDepartment" type="text" placeholder="Department / pemegang asset">
    <label>Lokasi</label>
    <input id="fLocation" type="text" placeholder="Lokasi asset">
    <label>Condition</label>
    <select id="fCondition"></select>
    <label>Status</label>
    <select id="fStatus"></select>
    <label>Foto Asset</label>
    <div id="photoBox">
      <img id="fPhotoPreview" alt="Foto asset">
      <div id="fPhotoEmpty">Belum ada foto</div>
      <div class="btnRow photo">
        <button type="button" id="btnPickPhoto">📷 Ambil / Pilih Foto</button>
        <button type="button" id="btnUploadPhoto" disabled>📤 Upload Foto</button>
      </div>
      <input type="file" id="fPhotoInput" accept="image/*" style="display:none">
    </div>
    <div class="btnRow">
      <button id="btnSkip">Lewati</button>
      <button id="btnSave">💾 Simpan Perubahan</button>
    </div>
  </div>

  <div id="history"></div>
  <div class="hint">Setiap scan otomatis dicatat ke log. Ubah field di atas kalau ada perubahan data, lalu tekan Simpan.</div>

  <script>
    // ==========================================================
    // WAJIB DIISI sebelum di-deploy:
    // 1. WEBAPP_URL  -> URL deployment Web App Apps Script Anda, akhiran "/exec"
    // 2. SECRET_KEY   -> HARUS SAMA PERSIS dengan secret yang diset lewat menu
    //    Google Sheets "🔑 Set / Ganti Secret Scanner Eksternal"
    //
    // CATATAN KEAMANAN: halaman ini statis, SECRET_KEY pasti terlihat lewat
    // "view source". Anggap sebagai "kunci pintu gudang", bukan password
    // rahasia mutlak. Ganti secara berkala lewat menu di atas kalau perlu.
    //
    // HALAMAN INI HANYA BOLEH DIPAKAI OLEH PETUGAS YANG BERHAK MENGUBAH DATA
    // (input scan + edit Department/Lokasi/Condition/Status). Untuk sekadar
    // melihat kartu asset tanpa mengubah apa pun, pakai scanner-view-kartu.html.
    // ==========================================================
    const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyiexYQMZGQTL2FLQqPtMxUCJdeI2MQeB_5g4C6FiTkpJ34NtCohU3Jd11uUVzjTu9t/exec';
    const SECRET_KEY = 'Malang2026';

    // Pilihan Condition = dropdown di kolom H Google Sheet. Daftar ini hanya
    // CADANGAN; kalau server mengirim conditionOptions (dibaca langsung dari
    // dropdown sheet), daftar dari server yang dipakai.
    let CONDITION_OPTIONS = [
      'Baik (Good)',
      'Rusak Ringan (Need Repair)',
      'Rusak Berat (Demager/Obsolate)',
      'Tidak Ditemukan (Missing)',
      'Aset Tanpa Catatan (Unrecorded)'
    ];
    // Pilihan Status sama dengan yang ada di Dashboard.
    const STATUS_OPTIONS = ['Aktif', 'Nonaktif - Rusak', 'Nonaktif - Disposal', 'Nonaktif - Scrap Warehouse'];

    let busy = false;
    let currentItem = null; // item hasil scan terakhir, dipakai saat Simpan Perubahan
    const historyEl = document.getElementById('history');
    const resultEl = document.getElementById('result');
    const editForm = document.getElementById('editForm');

    function addHistory(text, cls) {
      const row = document.createElement('div');
      row.innerHTML = '<span class="' + cls + '">' + text + '</span>';
      historyEl.prepend(row);
      while (historyEl.children.length > 8) historyEl.removeChild(historyEl.lastChild);
    }

    function resetForNextScan() {
      busy = false;
      currentItem = null;
      pendingPhoto = null;
      if (typeof startScanner === 'function') startScanner(); // nyalakan lagi kalau tadi dihentikan untuk foto
      editForm.style.display = 'none';
      resultEl.innerText = 'Arahkan kamera ke barcode/QR kode asset berikutnya...';
    }

    // Isi <select> dengan daftar pilihan. Kalau nilai saat ini di sheet tidak
    // ada di daftar (data lama), tetap ditampilkan sebagai pilihan paling atas
    // supaya tidak terhapus diam-diam saat Simpan.
    function fillSelect(selectEl, options, current) {
      selectEl.innerHTML = '';
      const list = options.slice();
      if (current && list.indexOf(current) === -1) list.unshift(current);
      list.forEach(function (v) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        selectEl.appendChild(opt);
      });
      selectEl.value = current && list.indexOf(current) !== -1 ? current : list[0];
    }

    let formDirty = false; // true kalau petugas sudah mengubah isi form
    ['fDepartment','fLocation','fCondition','fStatus'].forEach(function (id) {
      const el = document.getElementById(id);
      el.addEventListener('input', function () { formDirty = true; });
      el.addEventListener('change', function () { formDirty = true; });
    });

    function showEditForm(item) {
      currentItem = item;
      formDirty = false;
      resetPhotoBox(item.foto || '');
      document.getElementById('fCode').innerText = item.number;
      document.getElementById('fItem').innerText = item.item;
      document.getElementById('fDepartment').value = item.department || '';
      document.getElementById('fLocation').value = item.location || '';
      fillSelect(document.getElementById('fCondition'), CONDITION_OPTIONS, item.condition);
      fillSelect(document.getElementById('fStatus'), STATUS_OPTIONS, item.status);
      editForm.style.display = 'block';
    }

    // ----- Indeks asset di HP: scan jadi INSTAN -----
    // Daftar ringkas semua asset dimuat sekali saat halaman dibuka (dan
    // disegarkan tiap 3 menit). Saat scan, kode dicocokkan LANGSUNG di HP
    // tanpa menunggu server; form edit muncul seketika. Pencatatan log tetap
    // berjalan di belakang layar. Kalau indeks belum siap atau kode tidak ada
    // di indeks (mis. asset baru), otomatis memakai lookup ke server.
    let ASSET_INDEX = null; // Map: kode (huruf kecil) -> item

    function loadAssetIndex() {
      if (document.hidden) return;
      fetch(WEBAPP_URL + '?action=index&secret=' + encodeURIComponent(SECRET_KEY), { method: 'GET' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.status !== 'success' || !res.items) return;
          const m = new Map();
          res.items.forEach(function (it) {
            const k = String(it.number || '').trim().toLowerCase();
            if (k && !m.has(k)) m.set(k, it);
          });
          ASSET_INDEX = m;
          if (res.conditionOptions && res.conditionOptions.length) CONDITION_OPTIONS = res.conditionOptions;
          if (!busy && !currentItem) {
            resultEl.innerText = 'Siap scan (' + m.size + ' asset dimuat). Arahkan kamera ke barcode/QR...';
          }
        })
        .catch(function () { /* diam: scan tetap jalan lewat lookup server */ });
    }

    function localLookup(code) {
      if (!ASSET_INDEX) return null;
      const it = ASSET_INDEX.get(String(code || '').trim().toLowerCase());
      return it ? { item: it } : null;
    }

    function renderFound(item, logPromise) {
      resultEl.innerHTML =
        '<span class="ok">✅ ' + item.number + ' - ' + item.item + '</span><br>' +
        item.department + ' • ' + item.location +
        '<br><span id="logState" class="warn">⏳ Mencatat ke log...</span>';
      // Tampilkan form supaya petugas bisa langsung update kalau ada perubahan
      showEditForm(item);
      trackLog(logPromise, item.number, false);
    }

    function renderNotFound(decodedText, logPromise) {
      resultEl.innerHTML =
        '<span class="warn">⚠️ Kode "' + decodedText + '" tidak ditemukan di data.</span><br>' +
        '<span id="logState" class="warn">⏳ Mencatat ke log...</span>';
      trackLog(logPromise, decodedText, true);
      busy = false;
    }

    // Langkah 1: setiap kode yang discan dicatat sebagai INPUT (POST -> Sheet1 +
    // Log Perubahan) di belakang layar, sementara data asset ditampilkan secepat
    // mungkin: dari indeks di HP kalau ada, kalau tidak lewat lookup server.
    function onScanSuccess(decodedText) {
      if (busy) return;
      busy = true;
      editForm.style.display = 'none';

      // (a) Pencatatan log - jalan di belakang layar
      const logPromise = fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari preflight CORS
        body: JSON.stringify({ data: decodedText, secret: SECRET_KEY })
      }).then(function (r) { return r.json(); });

      // (b) Cocokkan langsung di HP -> tampil INSTAN
      const local = localLookup(decodedText);
      if (local) {
        renderFound(local.item, logPromise);
        return;
      }

      // (c) Tidak ada di indeks / indeks belum siap -> lookup ke server
      resultEl.innerHTML = 'Memproses kode: ' + decodedText + ' ...';
      const lookupUrl = WEBAPP_URL
        + '?action=lookup'
        + '&data=' + encodeURIComponent(decodedText)
        + '&secret=' + encodeURIComponent(SECRET_KEY);

      fetch(lookupUrl, { method: 'GET' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.status !== 'success') {
            resultEl.innerHTML = '<span class="err">❌ ' + (res.message || 'Gagal') + '</span>';
            addHistory('❌ ' + (res.message || 'Gagal'), 'err');
            busy = false;
            return;
          }
          if (res.conditionOptions && res.conditionOptions.length) {
            CONDITION_OPTIONS = res.conditionOptions;
          }
          if (res.found) renderFound(res.item, logPromise);
          else renderNotFound(decodedText, logPromise);
        })
        .catch(function (err) {
          resultEl.innerHTML = '<span class="err">❌ Gagal menghubungi server: ' + err + '</span>';
          addHistory('❌ Gagal menghubungi server', 'err');
          busy = false;
        });
    }

    // Menunggu hasil pencatatan log (POST) dan memperbarui status di layar.
    function trackLog(logPromise, shownCode, notFound) {
      logPromise
        .then(function (res) {
          const stateEl = document.getElementById('logState');
          if (res.status !== 'success') {
            if (stateEl) { stateEl.className = 'err'; stateEl.innerText = '❌ Gagal mencatat log: ' + (res.message || ''); }
            addHistory('❌ Gagal mencatat ' + shownCode + ': ' + (res.message || ''), 'err');
            return;
          }
          if (stateEl) { stateEl.className = 'ok'; stateEl.innerText = '📝 Tercatat di log.'; }
          // Data dari server = paling baru. Kalau petugas belum mengubah isi form,
          // segarkan form dengan data terbaru (jaga-jaga indeks di HP agak usang).
          if (res.found && res.item && currentItem && currentItem.number === res.item.number && !formDirty) {
            showEditForm(res.item);
          }
          addHistory(notFound
            ? ('⚠️ ' + res.timestamp + ' — kode "' + shownCode + '" tidak dikenal (tetap dicatat)')
            : ('✅ ' + res.timestamp + ' — ' + shownCode + ' (input)'),
            notFound ? 'warn' : 'ok');
        })
        .catch(function (err) {
          const stateEl = document.getElementById('logState');
          if (stateEl) { stateEl.className = 'err'; stateEl.innerText = '❌ Gagal mencatat log (koneksi).'; }
          addHistory('❌ Gagal mencatat ' + shownCode + ' (koneksi)', 'err');
        });
    }

    // Langkah 2 (opsional): kirim mode='update' HANYA kalau petugas mengubah
    // salah satu field di form dan menekan tombol Simpan Perubahan.
    document.getElementById('btnSave').addEventListener('click', function () {
      if (!currentItem) return;
      const all = {
        department: document.getElementById('fDepartment').value.trim(),
        location: document.getElementById('fLocation').value.trim(),
        condition: document.getElementById('fCondition').value.trim(),
        status: document.getElementById('fStatus').value.trim()
      };
      // Kirim HANYA field yang benar-benar berubah (payload lebih kecil, server
      // lebih sedikit kerja). Kalau tidak ada yang berubah, tidak perlu ke server.
      const updates = {};
      let changed = 0;
      Object.keys(all).forEach(function (k) {
        if (all[k] && all[k] !== String(currentItem[k] || '').trim()) { updates[k] = all[k]; changed++; }
      });
      if (!changed) {
        resultEl.innerHTML = '<span class="warn">⚠️ Tidak ada perubahan untuk disimpan.</span>';
        return;
      }

      const saved = currentItem;
      document.getElementById('btnSave').disabled = true;
      resultEl.innerHTML = '⏳ Menyimpan perubahan...';

      fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          data: saved.number,
          secret: SECRET_KEY,
          mode: 'update',
          category: saved.category,
          updates: updates
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          document.getElementById('btnSave').disabled = false;
          if (res.status !== 'success') {
            resultEl.innerHTML = '<span class="warn">⚠️ ' + (res.message || 'Tidak ada perubahan') + '</span>';
            addHistory('⚠️ ' + (res.message || 'Tidak ada perubahan'), 'warn');
            // Form tetap terbuka supaya petugas bisa memperbaiki & mencoba lagi
            return;
          }
          resultEl.innerHTML = '<span class="ok">✅ Perubahan data ' + res.item.number + ' tersimpan.</span>';
          addHistory('💾 ' + res.timestamp + ' — ' + res.item.number + ' (update)', 'ok');
          // Langsung siap scan berikutnya (tanpa jeda); pesan sukses tetap terlihat
          busy = false;
          currentItem = null;
          pendingPhoto = null;
          editForm.style.display = 'none';
          startScanner();
        })
        .catch(function (err) {
          document.getElementById('btnSave').disabled = false;
          resultEl.innerHTML = '<span class="err">❌ Gagal menyimpan: ' + err + '</span>';
        });
    });

    document.getElementById('btnSkip').addEventListener('click', function () {
      resetForNextScan();
    });


    // Pemanasan server: Apps Script yang lama tidak dipakai butuh 1-3 detik
    // untuk "bangun" di scan pertama. Kirim lookup ringan (read-only) saat
    // halaman dibuka & setiap 4 menit selama halaman terbuka, supaya scan
    // berikutnya langsung cepat.
    function warmUpServer() {
      if (document.hidden) return;
      fetch(WEBAPP_URL + '?action=lookup&data=__warmup__&secret=' + encodeURIComponent(SECRET_KEY), { method: 'GET' })
        .catch(function () {});
    }
    warmUpServer();
    setInterval(warmUpServer, 4 * 60 * 1000);
    loadAssetIndex();
    setInterval(loadAssetIndex, 3 * 60 * 1000);


    // ----- Kamera scanner: bisa dihentikan sementara saat mengambil foto -----
    // (di sebagian HP, kamera untuk foto tidak bisa dibuka selagi kamera scanner aktif)
    let html5QrCode = null;
    let scannerOn = false;

    function startScanner() {
      if (scannerOn || typeof Html5Qrcode === 'undefined') return Promise.resolve();
      if (!html5QrCode) {
        // Pakai detektor bawaan browser (jauh lebih cepat) kalau tersedia
        html5QrCode = new Html5Qrcode("reader", { experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
      }
      return html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).then(function () { scannerOn = true; })
       .catch(function (err) {
        resultEl.innerHTML = '<span class="err">Gagal mengakses kamera: ' + err + '<br>Pastikan browser diberi izin kamera dan halaman diakses lewat HTTPS.</span>';
      });
    }

    function stopScanner() {
      if (!scannerOn || !html5QrCode) return Promise.resolve();
      return html5QrCode.stop().then(function () { scannerOn = false; }).catch(function () { scannerOn = false; });
    }

    // ----- Foto asset -----
    let pendingPhoto = null; // { base64, mimeType, fileName } -> menunggu di-upload
    const photoInput = document.getElementById('fPhotoInput');
    const photoPreview = document.getElementById('fPhotoPreview');
    const photoEmpty = document.getElementById('fPhotoEmpty');
    const btnPick = document.getElementById('btnPickPhoto');
    const btnUploadPhoto = document.getElementById('btnUploadPhoto');

    function showPhoto(src) {
      if (src) {
        photoPreview.src = src;
        photoPreview.style.display = 'block';
        photoEmpty.style.display = 'none';
      } else {
        photoPreview.removeAttribute('src');
        photoPreview.style.display = 'none';
        photoEmpty.style.display = 'block';
      }
    }

    function resetPhotoBox(existingUrl) {
      pendingPhoto = null;
      photoInput.value = '';
      btnUploadPhoto.disabled = true;
      btnUploadPhoto.innerText = '📤 Upload Foto';
      btnPick.innerText = existingUrl ? '📷 Ganti Foto' : '📷 Ambil / Pilih Foto';
      showPhoto(existingUrl);
    }

    // Perkecil foto di HP (maks 1280px, JPEG 80%) supaya upload cepat & hemat kuota.
    function resizeImage(file, maxSide, quality) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onerror = function () { reject(new Error('Gagal membaca file foto.')); };
        reader.onload = function () {
          const img = new Image();
          img.onerror = function () { reject(new Error('File bukan gambar yang valid.')); };
          img.onload = function () {
            let w = img.width, h = img.height;
            const scale = Math.min(1, maxSide / Math.max(w, h));
            w = Math.round(w * scale); h = Math.round(h * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    btnPick.addEventListener('click', function () {
      // Hentikan kamera scanner dulu, baru buka kamera/galeri untuk foto
      stopScanner().then(function () { photoInput.click(); });
    });

    photoInput.addEventListener('change', function () {
      const file = photoInput.files && photoInput.files[0];
      if (!file || !currentItem) return;
      btnUploadPhoto.disabled = true;
      resultEl.innerHTML = '⏳ Memproses foto...';
      resizeImage(file, 1280, 0.8)
        .then(function (dataUrl) {
          pendingPhoto = {
            base64: dataUrl.split(',')[1],
            mimeType: 'image/jpeg',
            fileName: currentItem.number + '.jpg'
          };
          showPhoto(dataUrl);
          formDirty = true; // jangan sampai form disegarkan otomatis & menghapus foto yang baru dipilih
          btnUploadPhoto.disabled = false;
          resultEl.innerHTML = '<span class="ok">📷 Foto siap. Tekan "Upload Foto" untuk menyimpan.</span>';
        })
        .catch(function (err) {
          resultEl.innerHTML = '<span class="err">❌ ' + (err && err.message ? err.message : err) + '</span>';
        });
    });

    btnUploadPhoto.addEventListener('click', function () {
      if (!currentItem || !pendingPhoto) return;
      const saved = currentItem;
      const photo = pendingPhoto;
      btnUploadPhoto.disabled = true;
      btnUploadPhoto.innerText = '⏳ Mengupload...';
      resultEl.innerHTML = '⏳ Mengupload foto ' + saved.number + '...';

      fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          data: saved.number,
          secret: SECRET_KEY,
          mode: 'photo',
          category: saved.category,
          photo: photo
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.status !== 'success') {
            btnUploadPhoto.disabled = false;
            btnUploadPhoto.innerText = '📤 Upload Foto';
            resultEl.innerHTML = '<span class="err">❌ ' + (res.message || 'Gagal upload foto') + '</span>';
            addHistory('❌ Gagal upload foto ' + saved.number + ': ' + (res.message || ''), 'err');
            return;
          }
          saved.foto = res.foto; // simpan di data lokal (juga di indeks) supaya form berikutnya sudah membawa foto
          pendingPhoto = null;
          btnUploadPhoto.innerText = '✅ Foto tersimpan';
          btnPick.innerText = '📷 Ganti Foto';
          resultEl.innerHTML = '<span class="ok">✅ Foto ' + saved.number + ' tersimpan.</span>';
          addHistory('📷 ' + res.timestamp + ' — ' + saved.number + ' (foto)', 'ok');
        })
        .catch(function (err) {
          btnUploadPhoto.disabled = false;
          btnUploadPhoto.innerText = '📤 Upload Foto';
          resultEl.innerHTML = '<span class="err">❌ Gagal upload foto: ' + err + '</span>';
        });
    });

    if (WEBAPP_URL.indexOf('GANTI_DENGAN') !== -1 || SECRET_KEY.indexOf('GANTI_DENGAN') !== -1) {
      resultEl.innerHTML = '<span class="err">Halaman belum dikonfigurasi. Isi WEBAPP_URL & SECRET_KEY di source code dulu.</span>';
    } else if (typeof Html5Qrcode === 'undefined') {
      resultEl.innerHTML = '<span class="err">Gagal memuat library scanner. Periksa koneksi internet lalu muat ulang halaman.</span>';
    } else {
      startScanner();
    }
  </script>
</body>
</html>
